# Brand Space Profile: 九州美学 (Phase 8D Test A)
# 来源文档: Space Generator v1.1 Phase 8D Multi-brand Space Validation §4 (Test A)
# 创建时间: 2026-08-01
#
# 角色: 验证 Phase 8C runtime 不下降 (baseline regression test).
# 与 brand-space-examples/feng-tangtang, yijiliangfang 对比, 检查 JZMX 行业特征保留.

brand:
  name: 九州美学
  brandKey: jiuzhou-aesthetics
  category: medical_aesthetics
  industry: 医疗美容与医美生态服务

# Phase 8D §4 Test A expected
expected_traits:
  architectural_elegance:
    description: 建筑事务所级别的高雅
    mechanism: 软边界 + 半透明介质 + 嵌入光
    examples:
      - "层叠半透明膜天花 (JZMX-ARCH-01)"
      - "窄框整面玻璃幕墙 (JZMX-ARCH-02)"
      - "连续膜天花 + 中心天窗 (JZMX-ARCH-03)"
  translucent_boundaries:
    description: 视觉连续, 听觉弱屏蔽
    mechanism: translucent_membrane + paper_screen
  soft_light_system:
    description: 嵌入光 + 顶底缝光, 不用直接射灯
    mechanism: integrated_wall_glow + ceiling_cavity_glow
  premium_medical_experience:
    description: 高端医疗体验, 不医院化
    mechanism: visibleButNotHospitalLike + warm_amber + soft_lavender

# Phase 8D §9 验收 1: 不下降
phase8d_acceptance:
  no_regression_vs_phase8c: |
    JZMX v0.3 DNA compileRuntimePrompt 后:
    - runtimeSummary.architectureBeauty == 25 (Phase 8C 实测)
    - runtimeSummary.brandIntegration == 20 (Phase 8C 实测)
    - runtimeSummary.functionalAdaptation == 21 (Phase 8C 实测)
    - runtimeSummary.conceptDriftPenalty == 1 (Phase 8C 实测)
  no_overfit_to_feng_tangtang: |
    JZMX prompt 不应包含 FTT 行业标志:
    - "warm_wood_booth" 不应出现在 JZMX 接待 prompt 主体 (除了 negativeConstraints 块)
    - "kitchen_pass_visible" 不应出现
    - "red_brick_wall" 不应出现
  no_overfit_to_yijiliangfang: |
    JZMX prompt 不应包含 YJLF 行业标志:
    - "rice_paper_screen" 不应出现 (除了 negativeConstraints 块)
    - "wooden_grid" 不应出现
    - "herbal_display_wall" 不应出现
    - "tea_corner" 不应出现

# Phase 8D §3 Risk 2 防护: anchor 不含 brand-specific 元素
anchor_decoupling_check:
  jzmx_arch_anchors:
    - id: JZMX-ARCH-01-ReceptionMembrane
      primaryMechanism: 层叠半透明介质 (architecture-language: translucent-boundary)
      no_brand_specific_decoration: true
    - id: JZMX-ARCH-02-EntranceGlass
      primaryMechanism: 窄框整面玻璃幕墙 + 短走廊缓冲 (architecture-language: soft-light-system)
      no_brand_specific_decoration: true
    - id: JZMX-ARCH-03-ConsultationFacade
      primaryMechanism: 单层大跨膜天花 + 中心天窗 (architecture-language: organic-flow)
      no_brand_specific_decoration: true

# 不可复刻项
do_not_copy:
  - exact_reception_desk_form
  - exact_membrane_ceiling_curve
  - exact_glass_facade_grid
  - exact_lavender_gradient_intensity

# Status
status: concept_only
image_status_note: |
  Phase 8D 当前不调真实 Provider, 没有 PNG.
  真实 PNG 待后续 phase 跑批后从用户项目数据目录复制并 commit.

# Frozen Record
frozen_at: '2026-08-01'
frozen_by: Space Generator v1.1 Phase 8D Multi-brand Space Validation
related_doc: 'Space Generator v1.1 Phase 8D Multi-brand Space Validation 开发文档'
directory_decision: |
  按 Phase 8D §6 提议, brand-space-examples/jiuzhou-aesthetics/ 是 metadata-only manifest.
  不创建 PNG, 不污染生产代码.
