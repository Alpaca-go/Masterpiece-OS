reference_id:
  - JZMX-SGR-01-Exterior
  - JZMX-SGR-02-Reception

project:
  name: 九州美学
  category: medical_aesthetics      # v1.0 文档 §11 定位；项目数据 factConfidence.industry=0，需后续确认
  project_id_local: a7a56ed7-849f-4671-b47a-466394d7298d
  source_data_root: 'C:\Users\Administrator\Documents\Masterpiece OS Data\projects\九州美学-a7a56ed7'

benchmark_role:
  exterior:
    type: exterior_brand_entrance
    purpose:
      - facade_language
      - entrance_experience
      - brand_visibility
      - night_lighting
  reception:
    type: interior_reception_experience
    purpose:
      - interior_language
      - material_system
      - lighting_system
      - brand_injection

quality_level:
  architectural_translation: S
  brand_translation: A

do_not_copy:
  - exact_layout
  - exact_camera_angle
  - exact_asset_position
  - exact_logo_position
  - exact_facade_structure
  - exact_reception_desk_shape

extract:
  - architecture_dna
  - material_dna
  - lighting_dna
  - composition_dna
  - brand_space_dna

# 空间不重复原则（v1.0 §13 + §34 规则三 / §15 关键控制）
motif_constraints:
  same_literal_motif_per_image_max: 1
  same_motif_across_batch_ratio_max: 0.5
  forbid_repeated_across_batch:
    - petal_sculpture
    - crystal_decoration
    - purple_led_strip

