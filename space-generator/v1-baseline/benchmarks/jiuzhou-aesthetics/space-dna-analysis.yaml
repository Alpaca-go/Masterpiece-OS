# JZMX-SGR-01 / 02 初始 Space DNA 分析（人工初版）
# 按 v1.0 §8 / §13 简版提取，详细字段进入 v1-experimental/field-schema/
# 这只是"初版观察"——具体字段进入 Space DNA Schema v0.1 必须满足 v1.0 §28 晋升规则

# ====== JZMX-SGR-01-Exterior ======
exterior:
  architecture_dna:
    spatial_concept: soft_continuity              # 柔性连续
    boundary_hardness: low                         # 不是硬边建筑
    statement_strength: high                       # 强建筑表达
  brand_space_dna:
    spirit:
      - scientific
      - elegant
      - healing
      - premium
      - futuristic
    literal_motif_observed:
      - low_saturation_purple_building_glow
      - continuous_facade_curve
      - soft_brand_wordmark_integration
    motif_count_observed: 2
  material_dna:
    primary:
      - mineral_plaster_white
      - fine_textured_stone
    accent:
      - brushed_metal
    material_count_observed: 3
  lighting_dna:
    primary_strategy: architectural_indirect_light
    building_self_glow: high
    decoration_visibility: low
  composition_dna:
    camera: three_quarter_wide
    focal_hierarchy:
      primary: facade_building
      secondary: entrance_reveal
    negative_space: high
  negative_observed: null                          # 没观察到失败模式

# ====== JZMX-SGR-02-Reception ======
reception:
  architecture_dna:
    spatial_concept: soft_continuity
    wall_to_ceiling_continuity: high
    boundary_softness: high
    statement_strength: high
  brand_space_dna:
    spirit:
      - scientific
      - elegant
      - healing
      - premium
    literal_motif_observed:
      - low_saturation_lavender_glow
      - refined_brand_wall
      - organic_reception_form
    motif_count_observed: 2
  functional_dna:
    commercial_realism: high
    reception_desk_legible: true
    waiting_area_visible: true
    circulation_readable: true
  material_dna:
    primary:
      - mineral_plaster
      - translucent_resin
    accent:
      - frosted_glass
    material_count_observed: 3
  lighting_dna:
    primary_strategy: architectural_indirect_light
    ceiling_cove_glow: high
    wall_edge_soft_glow: medium
    decorative_purple_visibility: low
  composition_dna:
    camera: human_eye_level
    focal_hierarchy:
      primary: reception_desk_brand_wall
      secondary: spatial_depth
    negative_space: high
  negative_observed: null

# ====== 跨两张图的稳定特征（v1.0 §11 进入正式字段候选）======
cross_image_stable_features:
  - soft_continuity_in_architecture
  - architectural_indirect_lighting
  - low_saturation_lavender_as_brand_color
  - restrained_material_palette_3_or_fewer
  - high_negative_space
  - organic_curves_dominant

# ====== 单图偶然特征（v1.0 §11 禁止固化）======
per_image_accidental:
  JZMX-SGR-01-Exterior:
    - exact_facade_curvature
    - exact_window_pattern
  JZMX-SGR-02-Reception:
    - exact_reception_desk_shape
    - exact_lighting_fixture_position

# ====== 失败模式（v1.0 §27 标签体系，初版无）======
failure_tags_observed: []

# ====== 后续要求 ======
notes:
  - "本文件是 v1 黄金参考的初版观察，**不是正式 Space DNA Schema v0.1**"
  - "正式字段晋升路径见 v1.0 §28：发现 → 3+ 场景测试 → 不导致机械重复 → 解释质量 → 人工批准"
  - "详细字段结构进入 v1-experimental/field-schema/（Phase 2 工作）"
