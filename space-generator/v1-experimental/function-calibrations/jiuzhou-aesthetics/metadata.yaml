# JZMX Function Calibration v1 — Metadata
# 来源文档: Space Generator v1.1 Phase 8B.1 Architecture-Function Balance Calibration §6
# 创建时间: 2026-08-01
# 触发版本: 5.0.0-rc.1
#
# 职责区别 (Phase 8B.1 §6):
#   Architecture Anchor (architecture-anchors/)     -> 控制建筑美感 (architectural beauty)
#   Function Calibration (本目录)                    -> 控制商业真实性 (commercial realism)
#   Architecture Function Bridge (DNA 字段)          -> 桥接两者
#
# 关键设计 (Phase 8B.1):
#   1. 不调真实 Provider -> 不创建 PNG 二进制文件, 仅 metadata + manifest + analysis 概念描述.
#   2. status: "concept_only" 明确标注, 避免 loader 误用.
#   3. 未来真实跑批 (Phase 8B.2+) 后, 可参照 Phase 8A 的方式从用户项目数据目录
#      (C:\Users\Administrator\Documents\Masterpiece OS Data\projects\...)
#      复制 PNG 并 commit 进来, 然后 status -> "real_image".
#   4. prompt text 只用 mechanism strings, imagePath 字段仅供 runtime 消费.
#      status=concept_only 时 imagePath 为 null, runtime prompt 不会引用任何 image.

reference_id:
  - JZMX-FUNC-01-reception-realism
  - JZMX-FUNC-02-consultation-flow

project:
  name: 九州美学
  category: medical_aesthetics
  project_id_local: a7a56ed7-849f-4671-b47a-466394d7298d

# Function Calibration 职责: 提供商业真实性锚点
# 与 Anchor (建筑机制) 不同, Calibration 是 "功能 / 商业现实" 样本
calibration_role:
  FUNC-01-reception-realism:
    type: reception_with_functional_anchors
    purpose:
      - reception_desk_with_storage_and_staff
      - waiting_area_with_seating_and_clients
      - clear_entrance_to_reception_path
      - visible_brand_presence_within_5pct_area
  FUNC-02-consultation-flow:
    type: consultation_with_operational_realism
    purpose:
      - multiple_consultation_stations_with_staff
      - privacy_gradient_from_public_to_semiprivate
      - circulation_path_wider_than_1.8m
      - visible_medical_compliance_without_hospital_look

# 接受程度: 商业功能 S 级, 建筑转译 A 级 (与 Anchor 互为镜像)
quality_level:
  architectural_translation: A
  brand_translation: A
  commercial_realism: S

# 不可复刻项 (与 Anchor 同标准, 防止 calibration 退化为模板)
do_not_copy:
  - exact_reception_desk_dimensions
  - exact_chair_count
  - exact_plant_choice
  - exact_staff_count
  - exact_client_count
  - exact_magazine_or_tea_set
  - exact_lighting_color_temperature

# 字段对应 (与 DNA architectureFunctionBridge 的 5 个 array 对齐)
# Calibration 提供商业真实性描述, bridge 在 DNA 里做"建筑机制 -> 商业动作"的翻译
extract:
  - functional_anchors
  - operational_realism
  - human_flow_pattern
  - commercial_truth_markers
  - concept_drift_guards

# status: concept_only, 真实 PNG 待 Phase 8B.2+ 真实跑批后补
status: concept_only
image_status_note: |
  当前 Phase 8B.1 不调真实 Provider, 没有真实 S 级图可作 calibration 锚点.
  真实 PNG 待后续 phase 跑批后从用户项目数据目录复制并 commit.
  Loader 已知 status=concept_only, 不会试图打开 imagePath.

# 空间不重复原则 (v1.0 §13 + §34 规则三)
motif_constraints:
  same_literal_scene_per_image_max: 1
  same_scene_across_batch_ratio_max: 0.5
  forbid_as_required:
    - exact_reception_desk_form
    - exact_chair_arrangement
    - exact_staff_uniform

# 锚点与现有字段的关系
relationship_to_existing:
  vs_architecture_anchor: |
    Architecture Anchor (architecture-anchors/) 提供 "建筑机制" 样本.
    Function Calibration (本目录) 提供 "商业现实" 样本.
    两者平行存在, 互为镜像. Anchor 控制美学, Calibration 控制真实性.
  vs_architecture_function_bridge: |
    Bridge 字段 (DNA.architectureFunctionBridge) 是 "翻译层":
      Architecture Anchor (建筑机制) --通过--> Bridge (翻译) --到--> Function Calibration (商业现实)
    Calibration 是 Bridge 的目标锚点; Bridge 是 Anchor + Calibration 的桥梁.
  vs_brand_translation: |
    brandTranslationRules 把品牌翻译为空间机制 (spirit -> space mechanism).
    architectureFunctionBridge 把建筑翻译为商业动作 (architecture -> functional action).
    两者并行, 不互替.

# 冻结记录
frozen_at: '2026-08-01'
frozen_by: Space Generator v1.1 Phase 8B.1 Architecture-Function Balance Calibration
related_doc: 'Space Generator v1.1 Phase 8B.1 Architecture-Function Balance Calibration 开发文档'
whitelist_extension_pending: tests/repository-policy.test.js
  # 在 v1.0 §3 既有白名单基础上加入本目录 (Phase 8B.1 后续)
directory_decision: |
  按 Phase 8B.1 §6 设计, Function Calibration 独立于 architecture-anchors/ 与 golden-references/.
  目录为 space-generator/v1-experimental/function-calibrations/jiuzhou-aesthetics/.
  不创建 PNG (不调真实 Provider), 仅 metadata + analysis 概念描述.
