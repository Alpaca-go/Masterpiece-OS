# JZMX-FUNC Function DNA Analysis v1
# 来源文档: Space Generator v1.1 Phase 8B.1 Architecture-Function Balance Calibration §1 / §2
# 创建时间: 2026-08-01
#
# 目的: 从 2 个 Function Calibration 概念反向抽取 商业真实性 DNA,
#       作为 architectureFunctionBridge 字段的目标锚点,
#       缓解 Phase 8B 暴露的 Architecture Concept Drift.
#
# 与 architecture-anchors/jiuzhou-aesthetics/architecture-dna-analysis.yaml 的关系:
#   - Architecture Anchor 抽 4 个 mechanism (天花 / 外立面 / 隔断 / 家具)
#   - Function Calibration 抽 5 个 commercial reality 维度
#     (用户路径 / 操作约束 / 商业真实性 / 体验节奏 / 概念漂移防护)
#   - 两者是 Phase 8B.1 §6 设计的双锚点

# ====================================================================
# JZMX-FUNC-01: Reception Realism (接待区商业现实)
# ====================================================================
FUNC-01-reception-realism:
  observable_features:
    reception_desk:
      - 接待台后方有 staff, 1-2 位, 浅色长袍式制服
      - 接待台有功能性储物 (抽屉 / 柜门可见, 不是纯雕塑)
      - 接待台表面有可识别的消毒 / 急救 / 隐私标识
    waiting_area:
      - 沙发可坐 (有座深 + 靠背), 至少 3 人位
      - 茶几上可有杂志 / 茶具 / 鲜花 (1-3 件)
      - 1-3 位客户在等候, 着装日常, 不是装置
    entrance:
      - 街道一侧玻璃幕墙透明, 路人可看到内部
      - 进门 3 秒内视线自然落到接待台
    brand_presence:
      - logo 在墙面 / 接待台 / 物料, 面积 <= 5%
      - 不放满墙 logo, 也不用品牌字做装饰
  extracted_function_dna:
    functional_anchors:
      - "至少 1 位 staff 在接待台"
      - "接待台必须有功能性储物"
      - "等候区沙发可坐, 数量 >= 3 人位"
      - "至少 1 株真植物 (不是装饰膜)"
    operational_realism:
      - "接待台后方保留 1.5m staff 通道"
      - "等候区主通道宽度 >= 1.8m"
      - "急救 / 消毒 / 隐私标识可见, 但不放病床或手术灯"
      - "visibleButNotHospitalLike 表达 (medical_compliance)"
    human_flow_pattern:
      - "进门 3 秒内视线落到接待台"
      - "客户路径清晰, 不被装饰物阻挡"
      - "客户在等候区的平均停留 5-15 分钟, 沙发 + 茶几是必需"
    commercial_truth_markers:
      - "至少 1 处品牌内容物 (logo / 品牌墙 / 物料)"
      - "至少 1 处产品 / 服务展示 (展示架 / 咨询桌 / 数字屏)"
      - "可以出现 0-3 个客户 (sparse, 不是 crowd)"
      - "不出现 0 staff + 0 客户的纯展示 (那是展览馆, 不是医美)"
  do_not_impose:
    - exact_reception_desk_dimensions
    - exact_chair_count
    - exact_plant_species
    - exact_staff_count
    - exact_client_count
    - exact_magazine_or_tea_set_brand
    - exact_lighting_color_temperature

# ====================================================================
# JZMX-FUNC-02: Consultation Flow (咨询区运营流程)
# ====================================================================
FUNC-02-consultation-flow:
  observable_features:
    consultation_layout:
      - 多工位咨询桌, 2-4 位, 沿动线分布
      - 工位之间有软边界 (膜 / 屏风), 维持视觉连续 + 听觉弱屏蔽
      - 至少 1 位 staff 在工位
    privacy_gradient:
      - 接待 -> 等候 -> 咨询, 视觉与听觉上从 public 渐变到 semi-private
      - 不出现硬门 + 锁 (医美不是医院, 客户不应感到被关起来)
    circulation:
      - 主通道宽度 >= 1.8m, 满足轮椅通过
      - 走道不出现装饰物阻挡路径
    medical_compliance:
      - 咨询桌附近有可识别的消毒 / 急救标识
      - 不出现病床 / 手术灯 / 输液架 (那是医院, 不是医美)
    ambient:
      - 自然光为主, 室内辅助墙光
      - client 眼睛高度 = 柔和, 无强光斑 / 射灯直射 / 紫色色块
  extracted_function_dna:
    functional_anchors:
      - "至少 1 位 staff 在咨询区"
      - "工位之间软边界 (膜 / 屏风 / 半透明)"
      - "咨询桌 + 椅子 + 1-2 件办公用品 (不是纯装置)"
      - "至少 1 处品牌物料 (产品册 / 数字屏 / 展示架)"
    operational_realism:
      - "工位之间声压差 >= 10dB (前场 60dB, 半私工位 <= 50dB)"
      - "主通道 >= 1.8m, 满足无障碍"
      - "medical_compliance 标识可见"
      - "1.5m staff 通道在每个工位后保留"
    human_flow_pattern:
      - "客户从等候 -> 咨询的路径清晰, 不被装饰物阻挡"
      - "consultation 持续 10-30 分钟, 工位必须有桌面 + 椅子 + 隐私感"
      - "staff 沿动线分布, 不是固定 1 个点"
    commercial_truth_markers:
      - "至少 1 处产品 / 服务展示 (咨询桌上的产品册 / 数字屏 / 模型)"
      - "consultation 区有功能性桌 + 椅 (不是装置)"
      - "staff 数量 1-3 位 (sparse, 不是 crowd)"
      - "不出现 0 staff + 0 客户的纯展示"
  do_not_impose:
    - exact_staff_count
    - exact_desk_count
    - exact_chair_arrangement
    - exact_consultation_duration
    - exact_partition_form
    - exact_magazine_brand
    - exact_plant_choice

# ====================================================================
# 跨 2 个 calibration 稳定特征 (Phase 8B.1 §2)
# ====================================================================
cross_calibration_stable_features:
  functional_layer:
    - "至少 1 位 staff (前场 + 咨询, 缺一不可)"
    - "功能性储物 (不是纯雕塑)"
    - "可坐沙发 + 茶几 + 至少 1 株真植物"
    - "主通道 >= 1.8m, 满足无障碍"
  commercial_truth_layer:
    - "至少 1 处品牌内容物 (面积 <= 5%)"
    - "至少 1 处产品 / 服务展示"
    - "0 staff + 0 客户 = 展览馆, 不是医美"
    - "医疗合规 visibleButNotHospitalLike"
  drift_protection_layer:
    - "conceptDriftGuards 至少 5 条, 防止空间变展览"
    - "商业现实约束必须出现在 prompt, 不能被建筑语言压制"
    - "weightAllocation 0.45/0.3/0.25 (architecture 略降, functional 略升)"

# ====================================================================
# 单 calibration 偶然特征 (禁止固化)
# ====================================================================
per_calibration_accidental:
  FUNC-01:
    - 接待台具体形式
    - 沙发具体数量
    - staff 具体制服
    - 装饰物具体选择
  FUNC-02:
    - 工位具体数量
    - 隔断具体形式
    - 软装具体选择
    - 数字屏具体内容

# ====================================================================
# 失败模式 (v1.0 §27 标签体系, Phase 8B.1 新增)
# ====================================================================
failure_tags_observed:
  - "architecture_dominant_no_function"
  - "empty_gallery_no_staff"
  - "decorative_only_reception_desk"
  - "impossible_circulation_in_consultation"

