# Brand Space Profile: 冯烫烫 (Phase 8D Test B)
# 来源文档: Space Generator v1.1 Phase 8D Multi-brand Space Validation §4 (Test B)
# 创建时间: 2026-08-01
#
# 角色: 验证 architecture language 适应 restaurant 场景.
# 与 brand-space-examples/jiuzhou-aesthetics, yijiliangfang 对比, 防 JZMX overfit.

brand:
  name: 冯烫烫
  brandKey: feng-tang-tang
  category: restaurant
  industry: 餐饮 / 川菜 / 跷脚牛肉

# Phase 8D §4 Test B expected
expected_traits:
  human_scale:
    description: 人尺度, 不是 grand medical scale
    mechanism: booth_height 45cm + table_height 75cm + 1.2m booth_spacing
    examples:
      - "FTT-ARCH-01 KitchenAnchor 开放厨房"
      - "FTT-ARCH-02 WarmCommercialGrid 红砖墙 + 暖色木"
      - "FTT-ARCH-03 HumanScaleBooth 木 booth"
  warm_materials:
    description: 暖色材料, 不用冷/紫/玻璃幕墙
    mechanism: red_brick + warm_wood + terracotta 三元组
  wood_ceramic_natural_texture:
    description: 木 / 陶瓷 / 自然质感
    mechanism: warm_wood_booth + terracotta_tile + bamboo_screen
  cooking_atmosphere:
    description: 烟火气, 厨房可见
    mechanism: kitchen_pass_visible + warm_amber 灯光
  commercial_dining_circulation:
    description: 商业客流循环
    mechanism: grid_layout 通道 1.5m+, 不用 medical 工位

# Phase 8D §4 Test B forbidden (防 JZMX overfit)
forbidden:
  medical_beauty_style:
    description: 不应出现医美风格
    mechanism: no_translucent_membrane + no_purple_lighting + no_consultation_station
  futuristic_clinic_feeling:
    description: 不应出现未来医院感
    mechanism: no_embedded_light_strips + no_visibleButNotHospitalLike + no_medical_compliance

# Phase 8D §9 验收 2: FTT 不变 medical aesthetics
phase8d_acceptance:
  no_medical_aesthetics_overfit: |
    FTT v0.1 DNA compileRuntimePrompt 后:
    - prompt 不应包含 JZMX 标志 (translucent_membrane / purple_lavender_glow / soft_continuity)
    - 主体描述应包含 FTT 行业标志 (kitchen_pass / red_brick_wall / warm_wood_booth / wood_grid)
    - lightingDna.primaryStrategy 保持 natural_lighting (不是 architectural_indirect_light, 那是 JZMX 标志)
  no_feng_tangtang_to_jzmx: |
    FTT brand-space-examples 与 JZMX brand-space-examples 不共享:
    - 不同 architecture anchor (FTT-ARCH vs JZMX-ARCH)
    - 不同 industry applicability (FTT restaurant vs JZMX medical)
    - 不同 material 主导 (FTT warm_wood/red_brick vs JZMX mineral_plaster/frosted_glass)

# Phase 8D §3 Risk 2 防护
anchor_decoupling_check:
  ftt_arch_anchors:
    - id: FTT-ARCH-01-KitchenAnchor
      primaryMechanism: 开放厨房窗口 + 厨师动作可见 (architecture-language: organic-flow)
      no_brand_specific_decoration: true
    - id: FTT-ARCH-02-WarmCommercialGrid
      primaryMechanism: 红砖墙 + 暖色木 + 赤陶瓦 (architecture-language: material-continuity)
      no_brand_specific_decoration: true
    - id: FTT-ARCH-03-HumanScaleBooth
      primaryMechanism: 木 booth + 人尺度 (architecture-language: organic-flow)
      no_brand_specific_decoration: true

# 不可复刻项
do_not_copy:
  - exact_booth_count
  - exact_chair_arrangement
  - exact_tile_pattern
  - exact_chef_position
  - exact_menu_board_size
  - exact_bamboo_screen_density

# Status
status: concept_only
image_status_note: |
  Phase 8D 当前不调真实 Provider, 没有 PNG.
  真实 PNG 待后续 phase 跑批后从用户项目数据目录复制并 commit.

# Frozen Record
frozen_at: '2026-08-01'
frozen_by: Space Generator v1.1 Phase 8D Multi-brand Space Validation
related_doc: 'Space Generator v1.1 Phase 8D Multi-brand Space Validation 开发文档'
directory_decision: |
  按 Phase 8D §6 提议, brand-space-examples/feng-tangtang/ 是 metadata-only manifest.
  不创建 PNG, 不污染生产代码.
