# JZMX Architecture Anchor v1 — Metadata
# 来源文档: Space Generator v1.1 Architecture-Brand Fusion 开发文档
# 创建时间: 2026-08-01
# 触发版本: 5.0.0-rc.1
#
# 职责区别 (v1.1 §2):
#   Golden Reference (benchmarks/) -> 验证生成结果是否达到目标
#   Architecture Anchor (本目录)  -> 提供建筑空间语言
#   Brand Translation (field-schema) -> 品牌精神转译为空间语言
#
# Architecture Anchor 不进入验收锚点序列, 不参与 6 维评分;
# 它是 "建筑事务所设计思路" 的样本, 用来校准 Architecture DNA 字段.

reference_id:
  - JZMX-ARCH-01-ReceptionMembrane
  - JZMX-ARCH-02-EntranceGlass
  - JZMX-ARCH-03-ConsultationFacade

project:
  name: 九州美学
  category: medical_aesthetics
  project_id_local: a7a56ed7-849f-4671-b47a-466394d7298d
  source_data_root: 'C:\Users\Administrator\Documents\Masterpiece OS Data\projects\九州美学-a7a56ed7'

# Anchor 职责: 提供建筑空间语言
# 与 SGR 不同, SGR 是 "验收" 锚点, Anchor 是 "建筑机制" 样本
anchor_role:
  ARCH-01-ReceptionMembrane:
    type: interior_reception_with_membrane_ceiling
    purpose:
      - membrane_ceiling_geometry
      - reception_desk_form_language
      - waiting_area_architectural_enclosure
  ARCH-02-EntranceGlass:
    type: entrance_corridor_through_glass_facade
    purpose:
      - sliding_glass_facade_transition
      - curved_reception_wood_form
      - interior_visibility_from_exterior
  ARCH-03-ConsultationFacade:
    type: wide_consultation_floor_with_full_glass
    purpose:
      - full_height_glass_facade_opening
      - membrane_ceiling_at_scale
      - consultation_staff_arrangement
      - open_plan_with_subtle_privacy_gradient

# 接受程度: 建筑级别 S 级, 品牌转译 A 级
quality_level:
  architectural_translation: S
  brand_translation: A
  commercial_realism: S

# 不可复刻项 (与 SGR 同标准, 防止锚点退化为模板)
do_not_copy:
  - exact_reception_desk_form
  - exact_membrane_ceiling_curve
  - exact_glass_facade_grid
  - exact_camera_angle
  - exact_chair_placement
  - exact_plant_choice
  - exact_lavender_gradient_intensity

# 提取项 (供 v1.1 Step 3 字段调整使用)
extract:
  - architecture_dna
  - spatial_concept
  - boundary_geometry
  - ceiling_mechanism
  - facade_relationship
  - furniture_form_grammar
  - material_dna
  - lighting_dna

# 空间不重复原则 (v1.0 §13 + §34 规则三)
# Anchor 不进入负向约束, 但 banner 复刻 Anchor 不应作为生成目标
motif_constraints:
  same_literal_motif_per_image_max: 1
  same_motif_across_batch_ratio_max: 0.5
  forbid_as_required:
    - exact_membrane_curtain_form
    - exact_glass_facade_5_panel
    - exact_wood_reception_disk_shape

# 锚点与现有字段的关系
relationship_to_existing:
  vs_golden_reference: |
    Golden Reference (v1-baseline/benchmarks/) 提供 "质量 + 品牌识别" 锚点;
    Architecture Anchor (本目录) 提供 "建筑机制 + 空间语法" 锚点.
    两者并行存在, 不互替.
  vs_jzmx_dna_v0_1: |
    DNA v0.1 (v1-experimental/field-schema/examples/jiuzhou-aesthetics.dna.json)
    是 frozen 的 10 字段实例, 是 字段体系 的 第一个 instance.
    Architecture Anchor 是 字段体系 的 校准样本, 不直接修改 DNA.
    Step 3 (字段调整) 将基于本目录的 analysis.yaml, 决定是否在 v1.1
    引入 architecture_dna 字段子结构.

# 冻结记录
frozen_at: '2026-08-01'
frozen_by: Space Generator v1.1 Architecture-Brand Fusion
related_doc: 'Space Generator v1.1 Architecture-Brand Fusion 开发文档'
whitelist_extension: tests/repository-policy.test.js:37
  # 在 v1.0 §3 既有白名单基础上加入本目录
directory_decision: |
  按 v1.1 §1 设计, Architecture Anchor 独立于 golden-references.
  目录为 space-generator/v1-experimental/architecture-anchors/jiuzhou-aesthetics/.
  仓库治理白名单同步扩展, 详见 tests/repository-policy.test.js.
