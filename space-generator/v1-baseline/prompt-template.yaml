# Space Generator v1 Baseline — Prompt Template Spec
#
# 这个文件描述 v1 实际在用的 prompt 编译顺序与字段来源。
# 真正编译由 `apps/cli/src/v5/creative-director/prompt-builder.js` 完成；
# 这里只冻结"结构"，不冻结实现细节。
#
# 任何对 v1 的 prompt 顺序修改都必须走 v1-experimental/，
# 不得直接改本文件（见 space-generator/README.md）。

v1_template_id: space-generator-v1-baseline
frozen_at: '2026-08-01'
frozen_from_commit: '7394bd0'

prompt_order:
  - step: 1
    name: gpt_execution_core
    source: apps/cli/prompts/v5/deep-creative-director.md
    role: creative_director_system
    notes: |
      包含 Logo Locked / Maximum Creative Authority / 唯一一次完整判断 /
      唯一视觉升级命题 / 5 张图片生成顺序（Anchor / Packaging /
      Brand Context / Campaign Poster / Detail）。
  - step: 2
    name: benchmark
    source: apps/cli/prompts/v5/benchmark-instructions.md
    role: report_section_4
    notes: |
      Category Benchmark (2-3 行业) + Creative Excellence Benchmark
      (2-3 跨行业)，不固定 3 个，必须按信息价值决定总数。
  - step: 3
    name: report_structure
    source: apps/cli/prompts/v5/report-schema.md
    role: output_schema
    notes: |
      报告分 10 节，§7.4 是"空间"段（v1 没有独立的"空间"模块，
      空间生成由 §7.4 段落到 §8 图片生成顺序 Anchor Image 综合表达）。
  - step: 4
    name: execution_core
    source: apps/cli/prompts/v5/execution-core-template.md
    role: image_generation_template
    notes: |
      单张图片生成核心。Anchor Image 必须建立色彩、材质、光线、
      行业属性、构图和品牌气质。

# 空间生成在 v1 中的实际位置：
# - 报告 §7.4 空间段（描述空间语言）
# - §8 图片生成顺序中"Anchor Image"是默认首图（最常是空间）
# - 实际 prompt 编译 = §7.4 内容 + §8.1 Anchor 描述 + §6 视觉系统
# - 没有任何"独立空间 prompt template"——这是 v1 现状

prompt_construction_notes:
  - "v1 的空间 prompt 是一段长自然语言，不是结构化字段"
  - "图片生成顺序：1.Anchor / 2.Packaging / 3.Brand Context / 4.Campaign Poster / 5.Detail"
  - "v1 没法直接区分'这是空间图 vs 包装图'——靠 Anchor Image 描述里写"
  - "v1 不区分建筑级 vs 商业级 vs 行业模板——靠 deep-creative-director.md 的'判断质量'约束"

do_not_break:
  - "现有 apps/cli/prompts/v5/*.md 文件（v1-baseline 内的副本可改但必须保持事实一致）"
  - "现有 apps/cli/src/v5/creative-director/prompt-builder.js 编译逻辑"
  - "现有 packages/creative-production-runtime/* 任何模块"
  - "现有 packages/image-generation-runtime/* 任何模块"
