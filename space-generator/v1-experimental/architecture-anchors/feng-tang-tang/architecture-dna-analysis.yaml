# FTT-ARCH Architecture DNA Analysis v1
# 来源文档: Space Generator v1.1 Phase 8D Multi-brand Space Validation §4 (Test B)
# 创建时间: 2026-08-01
#
# 目的: 从 3 个 FTT-ARCH 概念反向抽取 restaurant 行业建筑 DNA.
# Phase 8D §4 验收: 验证 architecture language 不 overfit 到 medical_aesthetics 行业.
#
# 与 JZMX-ARCH 的对比 (Phase 8D Risk 1 防护):
#   - JZMX-ARCH: organic_translucent_structure / soft_light / continuous_spatial_membrane
#   - FTT-ARCH: warm_commercial_grid / kitchen_as_anchor / human_scale_booth
#   - 共同点 (Architecture Language, Phase 8D §7): spatial structure / material logic / circulation
#   - 区别点 (Brand Space Examples, Phase 8D §7): industry-specific decoration, kitchen vs consultation

# ====================================================================
# FTT-ARCH-01: KitchenAnchor (开放厨房作为视觉中心)
# ====================================================================
ARCH-01-KitchenAnchor:
  observable_features:
    kitchen_pass:
      - 厨房有可视窗口, 客人面朝厨师
      - 厨师制服/动作可见
      - 厨房灯光温暖, 不刺眼
    dining_layout:
      - 餐桌围绕厨房布局
      - 主通道宽度 >= 1.5m (commercial 客流)
      - 客人之间声压差 < 5dB (热闹氛围, 不需要屏蔽)
    focal_anchor:
      - 视觉焦点: 厨房 + 厨师动作
      - 不是膜天花 (membrane ceiling 是 JZMX 标志, FTT 不用)
      - 不是医疗合规 (medical compliance 是 JZMX 标志, FTT 不用)
  extracted_architecture_dna:
    spatial_concept: "厨房作为视觉中心, 客人围绕"
    ceiling_mechanism: "温暖木质天花或裸顶 (暴露结构, 不做膜天花)"
    circulation_mechanism: "dining 客流循环, 围绕 kitchen 排布"
    focal_mechanism: "open kitchen window + chef action as primary focal"
    rhythm: "active (客流循环, 不是 calm 等待)"
    material_palette:
      - red_brick_wall
      - warm_wood_booth
      - terracotta_tile
      - brass_kitchen_fixture
    lighting_strategy:
      primary: natural_lighting
      secondary: warm_amber_over_kitchen
      purple_brand_light: forbidden (Phase 8D Risk 1)
  do_not_impose:
    - exact_kitchen_window_size
    - exact_chef_count
    - exact_dining_table_layout

# ====================================================================
# FTT-ARCH-02: WarmCommercialGrid (暖色商业网格)
# ====================================================================
ARCH-02-WarmCommercialGrid:
  observable_features:
    wall_treatment:
      - 红砖墙或仿红砖 (warm_brick)
      - 木条装饰或木格 (warm_wood_grid)
      - 赤陶瓦或仿赤陶 (terracotta_tile)
    lighting:
      - 自然光为主 (natural_lighting primary)
      - 暖色吊灯或筒灯 (warm_amber accent)
      - 不用紫色 / 蓝色 / 冷光 (cool_color_forbidden)
    layout:
      - 网格状 booth 布局 (grid_layout)
      - 人尺度 booth 高度 (human_proportion_height)
      - 通道宽 1.5m+ (commercial 客流)
  extracted_architecture_dna:
    spatial_concept: "暖色商业网格, 人尺度"
    material_mechanism: "red_brick + warm_wood + terracotta 三元组, 不混入微水泥/金属/玻璃幕墙"
    lighting_mechanism: "natural + warm_amber, 不混入 purple_lavender_glow"
    circulation_mechanism: "grid_layout 客流循环, 不引导到 consultation 工位"
    rhythm: "active, 客人经过频率高"
    material_palette:
      - red_brick_wall
      - warm_wood_booth
      - terracotta_tile
      - bamboo_screen (optional)
    lighting_strategy:
      primary: natural_lighting
      secondary: warm_amber_pendant
      purple_brand_light: forbidden
  do_not_impose:
    - exact_brick_count
    - exact_booth_dimensions
    - exact_tile_pattern

# ====================================================================
# FTT-ARCH-03: HumanScaleBooth (人尺度 booth)
# ====================================================================
ARCH-03-HumanScaleBooth:
  observable_features:
    booth_design:
      - 木 booth 桌椅 (warm_wood_booth)
      - 座高 45cm, 桌高 75cm (human_proportion)
      - booth 之间 1.2m 间距 (acoustic_buffer)
    customer_facing:
      - 菜单板可见 (menu_board)
      - 餐桌有 1 份实物或图片 (food_or_menu_visual)
      - 烟火气 (warm_lighting + 实物感)
    material:
      - 木为主 (warm_wood dominant)
      - 少量金属 (brass_kitchen_fixture)
      - 不用膜 (no_translucent_membrane, JZMX 标志)
  extracted_architecture_dna:
    spatial_concept: "人尺度 booth 围合, 商业餐饮"
    furniture_mechanism: "wooden_booth + 1 桌 2-4 椅, 不放医疗 chair"
    material_mechanism: "warm_wood dominant, 不混入 mineral_plaster / frosted_glass (JZMX 标志)"
    circulation_mechanism: "booth 之间 1.2m 间距, 客人能横穿, 不需要 medical 工位间距"
    acoustic_mechanism: "booth 之间弱屏蔽 (热闹氛围, 不是 consultation privacy)"
    material_palette:
      - warm_wood_booth
      - red_brick_wall
      - terracotta_tile
    lighting_strategy:
      primary: natural_lighting
      secondary: warm_amber_pendant
      purple_brand_light: forbidden
  do_not_impose:
    - exact_booth_count
    - exact_chair_count
    - exact_table_dimensions

# ====================================================================
# 跨 3 个 FTT anchor 稳定特征 (Phase 8D §7 Architecture Language)
# ====================================================================
cross_anchor_stable_features:
  architecture_layer:
    - "warm_material (red_brick / wood / terracotta) 三元组, 3/3 anchor 都出现"
    - "natural_lighting + warm_amber, 不混入 purple"
    - "human_scale 比例, 不做 grand scale (membrane ceiling 是 grand scale)"
  brand_layer:
    - "烟火气 (food / cooking / human activity visible, 不是 medical 静谧)"
    - "dining 客流循环, 不是 consultation 工位"
    - "kitchen_as_anchor 视觉焦点, 不是 reception_desk"
  drift_protection_layer:
    - "禁止出现 translucent_membrane / soft_light / purple_lavender_glow / visibleButNotHospitalLike"
    - "禁止出现 mineral_plaster / frosted_glass (JZMX 标志材质)"

# ====================================================================
# 失败模式 (Phase 8D §3 Risk 1 检测)
# ====================================================================
failure_tags_observed:
  - "jzmx_style_overfit (出现膜天花 / 紫色 / 医疗标志)"
  - "empty_booth_no_kitchen (booth 是空的, 没有厨房, 失去 anchor)"
  - "high_end_clinic_look (出现高冷医院感, 不是 restaurant)"

