# Brand Space Profile: 一剂良方 (Phase 8D Test C)
# 来源文档: Space Generator v1.1 Phase 8D Multi-brand Space Validation §4 (Test C)
# 创建时间: 2026-08-01
#
# 角色: 验证 traditional health industry 翻译.
# 与 brand-space-examples/jiuzhou-aesthetics, feng-tangtang 对比, 防 overfit.

brand:
  name: 一剂良方
  brandKey: yi-ji-liang-fang
  category: health_management
  industry: 中医养生与健康管理

# Phase 8D §4 Test C expected
expected_traits:
  natural_materials:
    description: 自然材料
    mechanism: light_wood + matte_clay_wall + linen_fabric + brass_fitting
    examples:
      - "YJLF-ARCH-01 WoodenGrid 木格"
      - "YJLF-ARCH-02 PaperScreen 纸窗柔光"
      - "YJLF-ARCH-03 TeaCorner 茶角 + 问诊"
  calm_atmosphere:
    description: 安静氛围, 不是 FTT 烟火气也不是 JZMX 旗舰高端
    mechanism: natural_lighting + warm_amber_pendant + soft_light_no_neon
  eastern_order:
    description: 东方秩序, 网格 + 纸窗 + 暖色
    mechanism: wooden_grid + rice_paper + warm_palette
  consultation_privacy:
    description: 咨询隐私, 软边界不用硬门
    mechanism: paper_screen + wooden_grid, no hard_door + lock
  professional_service_environment:
    description: 专业服务环境, 中医咨询
    mechanism: tea_table + herbal_display_wall + consultation_desk

# Phase 8D §4 Test C forbidden (防 JZMX + FTT overfit)
forbidden:
  restaurant_atmosphere:
    description: 不应出现餐厅氛围
    mechanism: no_kitchen_pass_visible + no_active_dining_circulation + no_high_density_booth
  excessive_decoration:
    description: 不应过度装饰
    mechanism: low_decorative_density + restrained_material_palette + no_crystal_chandelier

# Phase 8D §9 验收 3: YJLF 保持 health 行业
phase8d_acceptance:
  health_management_industry_preserved: |
    YJLF v0.1 DNA compileRuntimePrompt 后:
    - prompt 应包含 YJLF 行业标志 (wooden_grid / rice_paper / tea_corner / herbal_display_wall)
    - lightingDna.primaryStrategy 保持 natural_lighting (中医养生不靠 architectural_indirect_light)
    - brandSpaceDna.brandSpirit.healing 应保持 0.9+ (中医养生重点)
    - 不应出现 JZMX 标志 (translucent_membrane / soft_continuity / purple_lavender_glow)
    - 不应出现 FTT 标志 (kitchen_pass_visible / red_brick_wall / warm_wood_booth 主导)
  no_yijiliangfang_to_jzmx: |
    YJLF brand-space-examples 与 JZMX brand-space-examples 不共享:
    - 不同 architecture anchor (YJLF-ARCH vs JZMX-ARCH)
    - 不同 industry applicability (YJLF health_management vs JZMX medical_aesthetics)
    - 不同 material 主导 (YJLF light_wood/matte_clay vs JZMX mineral_plaster/frosted_glass)

# Phase 8D §3 Risk 2 防护
anchor_decoupling_check:
  yjlf_arch_anchors:
    - id: YJLF-ARCH-01-WoodenGrid
      primaryMechanism: 木格 + 浅木色 (architecture-language: organic-flow)
      no_brand_specific_decoration: true
    - id: YJLF-ARCH-02-PaperScreen
      primaryMechanism: 宣纸 + 自然光柔化 (architecture-language: translucent-boundary)
      no_brand_specific_decoration: true
    - id: YJLF-ARCH-03-TeaCorner
      primaryMechanism: 茶几 + 咨询桌 + herbal_display (architecture-language: material-continuity)
      no_brand_specific_decoration: true

# 不可复刻项
do_not_copy:
  - exact_grid_count
  - exact_wood_pattern
  - exact_screen_density
  - exact_tea_set
  - exact_herbal_display_count
  - exact_chair_type
  - exact_plant_choice

# Status
status: concept_only
image_status_note: |
  Phase 8D 当前不调真实 Provider, 没有 PNG.
  真实 PNG 待后续 phase 跑批后从用户项目数据目录复制并 commit.

# Frozen Record
frozen_at: '2026-08-01'
frozen_by: Space Generator v1.1 Phase 8D Multi-brand Space Validation
related_doc: 'Space Generator v1.1 Phase 8D Multi-brand Space Validation 开发文档'
directory_decision: |
  按 Phase 8D §6 提议, brand-space-examples/yijiliangfang/ 是 metadata-only manifest.
  不创建 PNG, 不污染生产代码.
