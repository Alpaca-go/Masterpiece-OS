# JZMX-ARCH Architecture DNA Analysis v1
# 来源文档: Space Generator v1.1 Architecture-Brand Fusion 开发文档 §1 / §2
# 创建时间: 2026-08-01
#
# 目的: 从 3 张 JZMX-ARCH 图反向抽取 Architecture DNA 的具体形式,
# 作为 Step 3 (修改 Field Schema) 和 Step 4 (修改 Prompt Compiler) 的输入.
#
# 抽取原则 (v1.1 §6 / v1.0 §34 规则五):
#   每个建筑特征必须能转译为 "建筑机制 / 空间语法", 不直接绑死具体物.
#   如: "膜结构" -> "层叠半透明介质形成空间切片"
#        而不是 -> "必须出现透明丝巾"

# ====================================================================
# JZMX-ARCH-01: ReceptionMembrane
# ====================================================================
ARCH-01-ReceptionMembrane:
  observable_features:
    ceiling:
      - 双层半透明膜从天花向下垂落, 形成弧形剖面
      - 上下层膜在中心汇合, 产生夹层光环境
      - 膜在边缘缓慢过渡为墙, 无硬收边
    reception_desk:
      - 银灰色金属长方体, 顶部与底部都有发光缝
      - 与弧形膜的弧度对位, 不强求平行
    waiting_area:
      - 弧形长沙发, 颜色与墙面同调
      - 地面铺装是大块暖灰微水泥
    light_plant_integration:
      - 真实绿植, 数量克制 (1-2 株)
  extracted_architecture_dna:
    spatial_concept: "双层膜剖面切分空间"
    ceiling_mechanism: "层叠半透明介质 + 上下层夹光"
    boundary_mechanism: "软边界, 膜在边缘渐变为墙"
    furniture_form_grammar: "金属长方体 + 顶底发光缝"
    rhythm: "中心高, 边缘低, 单向渐变"
    material_palette:
      - mineral_plaster_white
      - brushed_metal
      - translucent_fabric
      - light_wood_accent
    lighting_strategy:
      primary: architectural_indirect_light
      secondary: ceiling_cavity_glow
      decorative_purple: low
  architectural_grammar_translation:
    # 把"具体物"翻译为"空间机制" (v1.1 §5)
    "双层膜":
      mechanism: "层叠半透明介质切分空间, 产生夹光"
      avoid_imposing: "exact_membrane_curtain_form"
    "金属长方体接待台":
      mechanism: "冷色金属长方体 + 顶底发光缝, 与暖色环境形成对比"
      avoid_imposing: "exact_reception_desk_form"
  do_not_impose:
    - exact_membrane_count (1 vs 2 vs 3 layers, 都可)
    - exact_reception_desk_dimensions
    - exact_waiting_sofa_curvature

# ====================================================================
# JZMX-ARCH-02: EntranceGlass
# ====================================================================
ARCH-02-EntranceGlass:
  observable_features:
    facade:
      - 整面落地玻璃推拉门, 黑色金属框极窄
      - 玻璃门后有一段短走廊, 走廊尽头是接待区
    ceiling:
      - 接待区天花是连续的弧形, 从走廊低天花向接待区抬升
      - 弧形天花与左侧矩形发光墙形成 L 型边界
    reception_desk:
      - 浅木色, 流线形, 与天花弧度呼应
      - 桌面有圆形凸起, 看似主台 + 副台组合
    waiting_chairs:
      - 两把轻木框架软包椅, 圆角, 与前台同色系
    light_box:
      - 走廊左侧有竖向矩形发光板, 内容物模糊
  extracted_architecture_dna:
    spatial_concept: "由低向高的空间序列"
    facade_mechanism: "窄框整面玻璃 + 短走廊缓冲"
    ceiling_mechanism: "连续弧形, 与墙发光形成 L 型边界"
    furniture_form_grammar: "轻木流线 + 圆角软包"
    rhythm: "水平推进, 由暗到明"
    material_palette:
      - light_wall_plaster
      - clear_glass
      - light_warm_wood
      - brushed_brass_or_wood_metal
    lighting_strategy:
      primary: natural_lighting
      secondary: integrated_wall_glow
      decorative_purple: very_low
  architectural_grammar_translation:
    "窄框玻璃推拉门":
      mechanism: "透明边界, 让街道与室内形成视觉连续"
      avoid_imposing: "exact_5_panel_glass_grid"
    "弧形天花":
      mechanism: "从入口低天花向内部高天花的连续抬升, 暗示服务渐入"
      avoid_imposing: "exact_ceiling_curve_shape"
    "竖向发光板":
      mechanism: "走廊尽头的方向引导器, 不承载具体内容"
      avoid_imposing: "exact_lightbox_size_or_position"
  do_not_impose:
    - exact_glass_panel_count
    - exact_corridor_length
    - exact_reception_desk_height_ratio
    - exact_chair_count

# ====================================================================
# JZMX-ARCH-03: ConsultationFacade
# ====================================================================
ARCH-03-ConsultationFacade:
  observable_features:
    facade:
      - 整面 3 大格落地玻璃, 中央 1 格是主入口
      - 玻璃外侧有两个长条形花池, 种植薰衣草类植物
    ceiling:
      - 整片半透明膜天花, 弧形隆起, 中心最高点有天窗
      - 膜天花跨越大面积, 不在每根梁上分格
    interior_layout:
      - 左侧: 长条形咨询台, 1 位 staff
      - 中央: 走道
      - 右侧: 多工位咨询桌, 2-3 位 staff 在工作
    partition:
      - 弧形膜从天花垂落, 在工位之间形成柔性分区
    staff:
      - 4 位 staff, 全部穿浅色长袍式制服
    ambient:
      - 自然光为主, 室内辅助墙光
  extracted_architecture_dna:
    spatial_concept: "膜天花下的多工位连续服务"
    facade_mechanism: "整面 3 大格玻璃 + 外侧长条植物软化街道边界"
    ceiling_mechanism: "单层大跨膜 + 中心天窗, 跨工位连续覆盖"
    partition_mechanism: "从天花垂落的弧形膜, 在工位间形成柔性切片"
    service_mechanism: "前台 + 连续工位, staff 沿动线分布"
    rhythm: "多工位并置, 由膜切片制造渐进私密"
    material_palette:
      - light_wall_plaster
      - clear_glass
      - translucent_fabric
      - light_warm_wood
      - live_plant_lavender
    lighting_strategy:
      primary: natural_lighting_with_skylight
      secondary: integrated_wall_wash
      decorative_purple: low (only via plant)
  architectural_grammar_translation:
    "3 大格落地玻璃":
      mechanism: "建筑外立面以最少分割展示最大内部, 服务于品牌可见性"
      avoid_imposing: "exact_3_panel_grid"
    "膜天花 + 天窗":
      mechanism: "自然光通过半透明介质柔化后落下, 消除直接光斑"
      avoid_imposing: "exact_skylight_position"
    "弧形膜切分工位":
      mechanism: "柔性分区代替硬隔断, 维持视觉连续 + 听觉弱屏蔽"
      avoid_imposing: "exact_membrane_count_or_position"
  do_not_impose:
    - exact_glass_panel_count_3
    - exact_plant_species
    - exact_staff_count
    - exact_desk_count

# ====================================================================
# 跨 3 张图稳定特征 (v1.1 §7 与 v1.0 §11 对齐, 字段晋升候选)
# ====================================================================
cross_image_stable_features:
  architecture_layer:
    - "半透明膜结构作为空间组织器 (3/3 张都出现)"
    - "曲线主导的天花语言 (3/3 张)"
    - "透明 / 半透明 + 软边界 (3/3 张)"
    - "建筑本身作为主品牌表达, 减少墙面 logo 依赖"
  material_layer:
    - "矿物微水泥 / 浅色 plaster 为主面材"
    - "金属 (银色 / 拉丝) 作为点睛"
    - "浅木作为温暖对位 (在 02/03 出现)"
    - "真植物作为软边界"
  lighting_layer:
    - "自然光为主, 建筑光为辅"
    - "低饱和薰衣草色作为品牌光, 面积克制"
    - "无直接射灯, 全为间接 / 嵌入光"
  boundary_layer:
    - "玻璃 / 膜 / 曲面作为软边界, 减少硬墙"
    - "天花与墙过渡无明显收边"

# ====================================================================
# 单图偶然特征 (v1.0 §11 禁止固化)
# ====================================================================
per_image_accidental:
  JZMX-ARCH-01:
    - 双层膜的精确数量
    - 金属台发光缝的精确宽度
    - 沙发弧度的具体曲率
  JZMX-ARCH-02:
    - 走廊长度
    - 玻璃门是推拉还是平开
    - 主台副台的具体组合
  JZMX-ARCH-03:
    - 整面玻璃 3 大格的具体分割比例
    - 工位数量
    - staff 数量

# ====================================================================
# 失败模式 (v1.0 §27 标签体系, 初版无)
# ====================================================================
failure_tags_observed: []

# ====================================================================
# 后续要求
# ====================================================================
notes:
  - "本文件是 Architecture Anchor 的初版观察, **不是正式 Space DNA Schema v1.1**"
  - "正式字段进入 v1.1 Step 3 (修改 Field Schema), 必须满足 v1.0 §28 晋升规则"
  - "Architecture DNA 字段子结构将由本文件 + 现有 field-schema 共同决定"
  - "3 张图的共同 '半透明膜 + 曲线天花 + 自然光' 三元组是 Step 3 的最小候选集"
  - "复刻任何具体物 (3 大格玻璃 / 双层膜 / 金属长方体台) 是 v1.0 §34 规则一/二 禁止的"
