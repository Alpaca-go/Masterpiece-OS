# YJLF-ARCH Architecture DNA Analysis v1
# 来源文档: Space Generator v1.1 Phase 8D Multi-brand Space Validation §4 (Test C)
# 创建时间: 2026-08-01
#
# 目的: 从 3 个 YJLF-ARCH 概念反向抽取 health_management (中医养生) 行业建筑 DNA.
# Phase 8D §4 验收: 验证 architecture language 不 overfit 到 medical_aesthetics 或 restaurant.

# ====================================================================
# YJLF-ARCH-01: WoodenGrid (木格分割, 传统秩序)
# ====================================================================
ARCH-01-WoodenGrid:
  observable_features:
    partition:
      - 木格 (wooden_grid) 替代硬墙
      - 浅木色 (light_wood dominant)
      - 中等透明度 (medium_transparency)
    layout:
      - 网格状 (grid layout) 但不是 cold medical grid
      - 暖色木为主, 不用冷钢/玻璃幕墙
      - 中等硬度 (medium_hardness, 不是 soft membrane)
    lighting:
      - 自然光为主 (natural_lighting primary)
      - 暖色筒灯 (warm_amber ambient)
      - 不用紫色 / 不用嵌入光带 (no purple / no embedded light strips, JZMX 标志)
  extracted_architecture_dna:
    spatial_concept: "木格分割, 传统秩序, 暖色"
    partition_mechanism: "wooden_grid 替代硬墙或膜切片, 维持视觉连续 + 听觉弱屏蔽"
    material_mechanism: "light_wood + matte_clay_wall + linen_fabric, 不混入 mineral_plaster / frosted_glass / translucent_membrane (JZMX 标志)"
    lighting_mechanism: "natural + warm_amber, 不混入 purple_lavender_glow / embedded_light_strips (JZMX 标志)"
    rhythm: "calm (中医问诊, 不是 FTT 烟火气, 也不是 JZMX 旗舰高端)"
    material_palette:
      - light_wood
      - matte_clay_wall
      - linen_fabric
      - brass_fitting (accent)
    lighting_strategy:
      primary: natural_lighting
      secondary: warm_amber_pendant
      purple_brand_light: forbidden
  do_not_impose:
    - exact_grid_count
    - exact_wood_pattern
    - exact_wall_height

# ====================================================================
# YJLF-ARCH-02: PaperScreen (纸窗柔光, 安静氛围)
# ====================================================================
ARCH-02-PaperScreen:
  observable_features:
    window_treatment:
      - 宣纸 / 棉纸窗户 (rice_paper window)
      - 自然光通过纸柔化 (natural light diffused through paper)
      - 不用膜天花 (no membrane ceiling, JZMX 标志)
    partition:
      - 纸屏风 (paper screen) 替代硬隔断
      - 不用玻璃幕墙 (no all_glass_facade, JZMX 标志)
      - 不用推拉门 (no sliding glass door, JZMX 标志)
    atmosphere:
      - 安静 (calm_atmosphere)
      - 不用霓虹灯 (no neon_signage, FTT 禁止但 YJLF 也不用)
      - 不用豪华装饰 (no luxury_decoration, JZMX 标志)
  extracted_architecture_dna:
    spatial_concept: "纸窗柔光, 安静氛围"
    window_mechanism: "rice_paper diffuses natural light, creates calm shadow"
    partition_mechanism: "paper screen partitions, not glass / steel / membrane"
    material_mechanism: "rice_paper + light_wood, 不用 frosted_glass / membrane"
    lighting_mechanism: "natural light diffused through paper, no direct sunlight"
    rhythm: "calm, no active movement"
    material_palette:
      - rice_paper
      - light_wood
      - linen_fabric
    lighting_strategy:
      primary: natural_lighting (diffused)
      secondary: warm_amber_pendant
      purple_brand_light: forbidden
      neon_signage: forbidden
  do_not_impose:
    - exact_screen_count
    - exact_paper_density
    - exact_window_position

# ====================================================================
# YJLF-ARCH-03: TeaCorner (茶角 + 问诊)
# ====================================================================
ARCH-03-TeaCorner:
  observable_features:
    tea_corner:
      - 茶几 + 椅 (tea_table + chair, 不是 booth)
      - 中医咨询氛围 (consultation atmosphere)
      - 茶具可见 (tea_set visible, 不用 kitchen_pass)
    consultation:
      - 咨询桌 + 椅 (consultation_desk + chair)
      - 中草药展示 (herbal_display_wall)
      - 不用 medical compliance 标志 (visibleButNotHospitalLike, JZMX 标志)
    privacy:
      - 软边界 (paper screen / wood grid)
      - 不用硬门 + 锁 (no hard_door + lock)
      - 客人感到被接住, 不感到被关起来
  extracted_architecture_dna:
    spatial_concept: "茶角 + 问诊, 中医专业服务"
    consultation_mechanism: "tea_table + chair, herbal_display_wall, no medical_equipment"
    privacy_mechanism: "soft boundary (paper screen), no hard door"
    material_mechanism: "light_wood + linen_fabric + brass_fitting, no medical stainless steel"
    circulation_mechanism: "calm circulation, no active dining flow"
    service_mechanism: "consultation_desk + herbal_display, not reception_desk + waiting_area"
    material_palette:
      - light_wood
      - tea_ceramic
      - rice_paper
      - linen_fabric
    lighting_strategy:
      primary: natural_lighting
      secondary: warm_amber_pendant
      purple_brand_light: forbidden
  do_not_impose:
    - exact_chair_count
    - exact_tea_set
    - exact_herbal_display_count

# ====================================================================
# 跨 3 个 YJLF anchor 稳定特征
# ====================================================================
cross_anchor_stable_features:
  architecture_layer:
    - "wooden_grid + paper_screen, 3/3 anchor 都出现"
    - "natural_lighting + warm_amber, 不混入 purple"
    - "calm_atmosphere, 不 active (FTT) 也不 grand_scale (JZMX)"
  brand_layer:
    - "传统 / 可信 / 调理 / 温和, 翻译为 wooden_grid + tea_corner + herbal_display"
    - "consultation_privacy 软边界, 不是 hard door"
  drift_protection_layer:
    - "禁止出现 translucent_membrane / soft_light / purple_lavender_glow (JZMX 标志)"
    - "禁止出现 kitchen_pass / active_dining (FTT 标志)"
    - "禁止出现 luxury_lounge / high_end_clinic (JZMX 旗舰标志)"

# ====================================================================
# 失败模式 (Phase 8D §3 Risk 1 检测)
# ====================================================================
failure_tags_observed:
  - "jzmx_style_overfit (出现膜天花 / 紫色 / 医疗标志)"
  - "ftt_style_overfit (出现厨房 / 烟火气 / booth 密集)"
  - "abstract_modern_art_museum (中医应该温暖, 不应冷抽象)"
  - "spa_atmosphere (中医不是 spa, 应有 herbal / 茶 / 木, 不是 luxury spa)"

